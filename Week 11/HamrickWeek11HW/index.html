
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><title>The Witch's Shopping List</title></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h2 id="title">Enchanted Atmosphere 🌙</h1> <!--Copy and pasted moon symbol -->
        <!-- Theme toggle section -->
        <button id="themeToggle">Change the Atmosphere</button>

        <!-- Section to add/remove list items -->
        <section>
            <h2>Magical Ingredients</h2>
            <button id="addItem">Add Ingredient</button>
            <ul id="items"></ul>
        </section>

        <!-- Section that reacts to keyboard -->
        <section>
            <h2>Mystical Keystrokes</h2>
            <p id="keyOutput">Press any key to reveal its magic...</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
