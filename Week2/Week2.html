<!DOCTYPE html>
<html lang="en"
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"
    <title>Document</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>

<!--This is a comment-->

    <div>
        <!--Generic container, no meaning by itself. Mainly used for styling or layout-->
    </div>

    <header>
        <!--Top section of the page or a section usually with a logo/title/into-->
    </header>

    <nav>
        <!--Contains navigation links, tells browswer/screen readers "This is the site menu"-->
    </nav>

    <section>
        <!--groups related content inside the <main> (chapters in a book)-->
    </section>

    <footer>
        <!--bottom of the page/section, usually copyright or contact info-->
    </footer>


    <!--Semantic tags describe the role of the content. Div does not-->
    <!--This is not a recommended way-->
    <div>
        <div>My website </div>
        <div>
            <a href="www.google.com">Click here to go to Google</a>
        </div>
        <div>
            About Me
        </div>
    </div>


    <!--This is with semantic tags-->
    <!--Easier to read-->
    <header>
        <h1>My website</h1>
    </header>
    <nav>
         <a href="www.google.com">Click here to go to Google</a>
    </nav>
    <main>
        <section>
            <h2>About me</h2>
            <p> </p>
        </section>
    </main>
    <footer>
        <p> @2025 My Website</p>
    </footer>

<!---->
    <ul>
        <!--Unorder lists: bulleted-->
    </ul>

    <ol>
        <!-- Ordered list: numbered-->
    </ol>

    <li>
        <!--this is the actual list item-->
    </li>

    <table>
        <!--this is the table container-->
    </table>

    <tr>
        <!-- this is the table row-->
    </tr>

    <th>
        <!--this is the table header-->
    </th>

    <td>
        <!--table data cell-->
    </td>


<ul>
<li>oranges</li>
<li>apples</li>
<li>pears</li>
</ul>

</ol>


<table border="2px">
    <tr>
        <th>Skill</th>
        <th>Level</th>
    </tr>
    <tr>
        <td>HTML</td>
        <td>Intermediate</td>
    </tr>

</table>

<!--css is what gives our website colors, fots, etc-->


</body>
</html>
