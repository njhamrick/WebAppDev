<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="lecture.css">
    <script>
        // JavaScript can go in here. Use double slashes for JavaScript comments.
        //Why Javascript? 
        // HTML is structure. CSS is style. Javascript is bahavior (interactivity, logic, data)
        //Javascript runs directly inthe browser. We do not need any extra software just yet

        //Using inside the script tags, which is what we will use during the lab
        // External JavaScript can be placed in a separate .js file for homework.
        console.log("This is my first log");
        console.log(5+10);
        //Variables: containers for storing data
        //let: reassignable
        //const: permanent

        let name="Nikki"; //string
        let age=26; //number
        const is_instructor=true; //boolean

        //Whenever we want output to the console, we will console.log
        console.log(name, age, is_instructor);

        //DATA TYPES
        //string: text in quotes
        //number: whole numbers
        //boolean: true/false value

        //Math in Javascript
        // +, -, *, /
        let x=5;
        let y=10;
        let total=x+y;
        console.log("Total is: "+total);

        //String concatenation
        let first="Hello";
        let second="World!";
        console.log(first+" "+second);




    </script>
    <title>Document</title>
</head>
<body>

<!--This is a comment-->

    <div>
        <!--Generic container, no meaning by itself. Mainly used for styling or layout-->
    </div>

    <header>
        <!--Top section of the page or a section usually with a logo/title/into-->
    </header>

    <nav>
        <!--Contains navigation links, tells browswer/screen readers "This is the site menu"-->
    </nav>

    <section>
        <!--groups related content inside the <main> (chapters in a book)-->
    </section>

    <footer>
        <!--bottom of the page/section, usually copyright or contact info-->
    </footer>

</body>
</html>
